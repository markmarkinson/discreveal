name: Windows quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install pinned Rust check components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Recycle and restore isolated Windows fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked recycle_fixture -- --ignored --test-threads=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/checkRustAdvisories.py
