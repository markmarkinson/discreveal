# Match the platform DiscReveal actually ships for; skips license text for
# crates that are only pulled in on other targets (Linux, macOS, ...).
targets = ["x86_64-pc-windows-msvc"]

private = { ignore = true } # Only our unpublished application; third-party crates stay checked.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
