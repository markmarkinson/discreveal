<!DOCTYPE html>
<html lang="en" data-disc-reveal="discReveal" data-mark-markinson="markMarkinson">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>DiscReveal</title>

    <!--
        Site-wide GitHub Pages 404 fallback (there is only one per project site —
        see the repo's own docs, `custom_404` was false before this file existed).
        Doubles as the target of the app's "check for updates" button: it opens
        /v-{version} (or /de/v-{version}), which never matches a
        real file, so this page is what actually loads. It reads the version back
        out of the URL and compares it against the latest GitHub release client-side
        — the app itself makes no network request at all, see shell.rs::check_for_updates.

        Hand-authored, not generated by scripts/buildSeoPages.js: that script bakes
        docs-src/site.template.html into two static per-language pages at build time;
        this page instead has to pick its language and content at *request* time from
        whatever path a visitor actually lands on, which doesn't fit that pipeline.
        Its own doc comment already carves out style.css/app.js/assets as hand-edited
        exceptions — this is the same kind of exception.
    -->
    <style>
        .update-shell {
            min-height: calc(100vh - 64px - 14px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0 64px;
        }
        .update-card {
            width: 100%;
            max-width: 600px;
            margin: 0 20px;
            padding: 32px 28px;
            border-radius: var(--radius-lg);
            background: var(--surface);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft-sm);
            text-align: center;
        }
        .update-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--accent-dim);
            color: var(--accent-hover);
        }
        .update-card h1 {
            font-family: var(--font-display);
            font-size: 21px;
            font-weight: 800;
            color: var(--text-1);
            margin: 0 0 8px;
        }
        .update-card p {
            font-size: 14px;
            line-height: 1.55;
            color: var(--text-2);
            margin: 0 0 22px;
        }
        .update-version {
            font-family: var(--font-mono);
            color: var(--text-1);
        }
        .update-card .pill-btn {
            justify-content: center;
        }
        .update-back {
            display: inline-block;
            margin-top: 18px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-3);
            text-decoration: none;
        }
        .update-back:hover {
            color: var(--accent-hover);
        }
        .hash-comparison { text-align: left; margin: 0 0 24px; padding: 16px; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 12px; }
        .hash-row + .hash-row { margin-top: 16px; }
        .hash-label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-2); }
        .hash-value { display: block; font-family: var(--font-mono); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; color: var(--text-3); }
        .hash-difference { padding: 0; background: transparent; border-bottom: 1px solid currentColor; }
        .hash-local .hash-difference { color: #ff8e98; background: rgba(229,9,20,.13); }
        .hash-official .hash-difference { color: #86dba3; background: rgba(34,197,94,.12); }
        .hash-comparison .hash-legend { font-size: 11px; color: var(--text-3); margin: 12px 0 0; }
    </style>
</head>
<body>

    <nav class="site-nav">
        <div class="site-nav-inner">
            <a href="/" class="brand" id="home-link">
                <img src="/icon.png" alt="" width="28" height="28" />
                <span>DiscReveal</span>
            </a>
            <div class="nav-right">
                <a href="/de/" class="language-btn" id="language-link" aria-label="Auf Deutsch umschalten" title="Auf Deutsch umschalten">
                    <span id="flag-de"><svg viewBox="0 0 5 3" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="5" height="3" fill="#ffce00"/><rect width="5" height="2" fill="#dd0000"/><rect width="5" height="1" fill="#000"/></svg></span>
                    <span id="flag-en" hidden><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="flag-en-frame"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="flag-en-diagonals"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#flag-en-frame)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#flag-en-diagonals)" stroke="#c8102e" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/></g></svg></span>
                </a>
            </div>
        </div>
    </nav>

    <main class="update-shell wrap">
        <div class="update-card" id="card">
            <div class="update-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h1 id="title">…</h1>
            <p id="body">…</p>
            <section id="hash-comparison" class="hash-comparison" hidden></section>
            <div id="action"></div>
            <a href="/" class="update-back" id="back-link">…</a>
        </div>
    </main>

    <script>
    (function () {
        'use strict';

        var COPY = {
            en: {
                checking: ['Checking…', 'Comparing your version against the latest release.'],
                upToDate: ['You’re up to date!', 'Your app is current. Thanks for using DiscReveal.'],
                fileUnchecked: 'File not checked: a fingerprint was unavailable. Your app is current, but this does not confirm its program file.',
                fileMatches: 'The program file matches the official download.',
                updateAvailable: ['Update available', 'A more recent official download is available for your app.'],
                checkFailed: ['Couldn’t check automatically', 'Find the latest release directly on GitHub instead.'],
                notFound: ['Page not found', 'That page doesn’t exist.'],
                hashMismatch: ['Version matches, but this file doesn’t', 'Your app is current, but its file differs from the official download. A copy built from source can differ. Download the official app if you are unsure of its origin.'],
                versionMismatch: ['This doesn’t match a real release', 'This app could not be matched to a published official build. It may be an unofficial copy.'],
                download: 'Download latest version',
                releases: 'View current release',
                back: 'Back to DiscReveal',
                localHash: 'Your executable · SHA-256',
                officialHash: 'Official download · SHA-256',
                hashLegend: 'Highlighted characters differ at the same position.',
            },
            de: {
                checking: ['Wird geprüft…', 'Deine Version wird mit dem neuesten Release verglichen.'],
                upToDate: ['Du bist aktuell!', 'Deine App ist aktuell. Danke, dass du DiscReveal nutzt.'],
                fileUnchecked: 'Datei nicht geprüft: Ein Fingerabdruck war nicht verfügbar. Deine App ist aktuell; die Programmdatei konnte aber nicht bestätigt werden.',
                fileMatches: 'Die Programmdatei stimmt mit dem offiziellen Download überein.',
                updateAvailable: ['Update verfügbar', 'Für deine App steht ein neuerer offizieller Download bereit.'],
                checkFailed: ['Konnte nicht automatisch geprüft werden', 'Die aktuelle Version findest du direkt auf GitHub.'],
                notFound: ['Seite nicht gefunden', 'Diese Seite gibt es nicht.'],
                hashMismatch: ['Version stimmt, aber diese Datei nicht', 'Deine App ist aktuell, aber ihre Datei unterscheidet sich vom offiziellen Download. Selbst erstellte Kopien können abweichen. Lade die offizielle App herunter, wenn du dir über die Herkunft unsicher bist.'],
                versionMismatch: ['Das entspricht keinem echten Release', 'Diese App konnte keinem veröffentlichten offiziellen Build zugeordnet werden. Es kann sich um eine inoffizielle Kopie handeln.'],
                download: 'Neueste Version herunterladen',
                releases: 'Aktuelles Release ansehen',
                back: 'Zurück zu DiscReveal',
                localHash: 'Deine EXE · SHA-256',
                officialHash: 'Offizieller Download · SHA-256',
                hashLegend: 'Farbig markiert sind die Zeichen, die an derselben Stelle abweichen.',
            },
        };

        var RELEASES_LATEST_URL = 'https://github.com/markmarkinson/discreveal/releases/latest';
        var DOWNLOAD_LATEST_URL = RELEASES_LATEST_URL + '/download/discreveal-portable.exe';
        var RELEASES_API_URL = 'https://api.github.com/repos/markmarkinson/discreveal/releases/latest';

        var segments = location.pathname.split('/').filter(Boolean);
        var lang = segments.indexOf('de') !== -1 ? 'de' : 'en';
        var copy = COPY[lang];
        var homePath = lang === 'de' ? '/de/' : '/';
        document.documentElement.lang = lang;
        var languageLink = document.getElementById('language-link');
        var comparisonPath = segments.filter(function (segment, index) { return !(index === 0 && segment === 'de'); }).join('/');
        languageLink.href = (lang === 'de' ? '/' : '/de/') + comparisonPath + (location.search || '') + (location.hash || '');
        languageLink.title = lang === 'de' ? 'Switch to English' : 'Auf Deutsch umschalten';
        languageLink.ariaLabel = languageLink.title;
        document.getElementById('flag-de').hidden = lang === 'de';
        document.getElementById('flag-en').hidden = lang !== 'de';
        document.getElementById('home-link').href = homePath;
        var backLink = document.getElementById('back-link');
        backLink.href = homePath;
        backLink.textContent = copy.back;

        var versionIndex = segments.findIndex(function (segment) { return /^v-/.test(segment); });
        var versionSegment = versionIndex !== -1 ? segments[versionIndex] : null;
        var requested = versionSegment ? versionSegment.slice(2) : null;
        // Optional second path segment: the requesting exe's own SHA-256, sent by shell.rs::check_for_updates
        // on a best-effort basis. Lets this page confirm the file is the official build, not just a recent
        // enough version — see the hashMismatch copy below for why a mismatch isn't necessarily malicious.
        var hashCandidate = versionIndex !== -1 ? segments[versionIndex + 1] : null;
        var submittedHash = hashCandidate && /^[0-9a-f]{64}$/i.test(hashCandidate) ? hashCandidate.toLowerCase() : null;

        var titleEl = document.getElementById('title');
        var bodyEl = document.getElementById('body');
        var actionEl = document.getElementById('action');

        function fill(text, vars) {
            return text.replace(/\{(\w+)\}/g, function (_, key) {
                return String(vars && vars[key] != null ? vars[key] : '').replace(/[&<>"']/g, function (character) {
                    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[character];
                });
            });
        }

        function showHashComparison(local, official, latest) {
            var section = document.getElementById('hash-comparison');
            section.replaceChildren();
            section.hidden = false;
            [[local, official, copy.localHash, 'hash-local'], [official, local, fill(copy.officialHash, {latest:latest}), 'hash-official']].forEach(function (item) {
                var row = document.createElement('div'); row.className = 'hash-row ' + item[3];
                var label = document.createElement('span'); label.className = 'hash-label'; label.textContent = item[2];
                var code = document.createElement('code'); code.className = 'hash-value';
                for (var index = 0; index < item[0].length; index++) {
                    var character = document.createElement(item[0][index] === item[1][index] ? 'span' : 'mark');
                    if (character.tagName === 'MARK') character.className = 'hash-difference';
                    character.textContent = item[0][index]; code.appendChild(character);
                }
                row.append(label, code); section.appendChild(row);
            });
            var legend = document.createElement('p'); legend.className = 'hash-legend'; legend.textContent = copy.hashLegend; section.appendChild(legend);
        }

        function render(pair, vars) {
            titleEl.textContent = pair[0];
            bodyEl.innerHTML = fill(pair[1], vars);
        }

        function addButton(label, href) {
            var link = document.createElement('a');
            link.className = 'pill-btn pill-btn-primary';
            link.href = href;
            link.textContent = label;
            actionEl.appendChild(link);
        }

        if (!requested) {
            render(copy.notFound);
            document.title = copy.notFound[0] + ' — DiscReveal';
            return;
        }

        document.title = 'DiscReveal — ' + copy.checking[0];
        render(copy.checking);
        addButton(copy.releases, RELEASES_LATEST_URL);

        function parseVersion(value) {
            var match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value || '');
            return match ? [Number(match[1]), Number(match[2]), Number(match[3])] : null;
        }

        function isOlder(a, b) {
            for (var i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] < b[i];
            }
            return false;
        }

        var controller = new AbortController();
        var timeout = setTimeout(function () { controller.abort(); }, 10000);
        fetch(RELEASES_API_URL, { headers: { Accept: 'application/vnd.github+json' }, signal: controller.signal })
            .then(function (response) {
                if (!response.ok) throw new Error('GitHub API responded with ' + response.status);
                return response.json();
            })
            .then(function (release) {
                if (parseVersion(release.tag_name)) return {release: release, version: release.tag_name};
                return fetch('/release.json', {signal: controller.signal, cache: 'no-store'})
                    .then(function (response) { if (!response.ok) throw new Error('Release metadata unavailable'); return response.json(); })
                    .then(function (facts) {
                        var asset = (release.assets || []).find(function (item) { return item.name === 'discreveal-portable.exe'; });
                        var digest = asset && String(asset.digest || '').replace(/^sha256:/i, '').toLowerCase();
                        if (!parseVersion(facts.version) || (/^[0-9a-f]{64}$/.test(digest || '') && digest !== facts.sha256)) throw new Error('Release metadata and download differ');
                        return {release: release, version: facts.version};
                    });
            })
            .then(function (info) {
                var release = info.release;
                clearTimeout(timeout);
                actionEl.replaceChildren();
                var latestTag = String(info.version || '').replace(/^v/, '');
                var exeAsset = (release.assets || []).find(function (asset) { return asset.name === 'discreveal-portable.exe'; });
                var digestCandidate = exeAsset && exeAsset.digest ? String(exeAsset.digest).replace(/^sha256:/i, '') : '';
                var officialDigest = /^[0-9a-f]{64}$/i.test(digestCandidate) ? digestCandidate.toLowerCase() : null;
                if (submittedHash && officialDigest && submittedHash !== officialDigest) showHashComparison(submittedHash, officialDigest, latestTag);
                var requestedVersion = parseVersion(requested);
                var latestVersion = parseVersion(latestTag);
                // Exactly equal, not just "not older" — a requested version that's *newer* than the
                // latest release (or fails to parse at all) is not a real, known release either, and
                // silently treating it as equal would hide that from the visitor.
                var versionsEqual = !!requestedVersion && !!latestVersion
                    && !isOlder(requestedVersion, latestVersion) && !isOlder(latestVersion, requestedVersion);

                if (requestedVersion && latestVersion && isOlder(requestedVersion, latestVersion)) {
                    render(copy.updateAvailable, { requested: requested, latest: latestTag });
                    addButton(copy.download, exeAsset && exeAsset.browser_download_url || DOWNLOAD_LATEST_URL);
                } else if (!versionsEqual) {
                    render(copy.versionMismatch, { requested: requested, latest: latestTag });
                    addButton(copy.releases, RELEASES_LATEST_URL);
                } else {
                    if (submittedHash && officialDigest && submittedHash !== officialDigest) {
                        render(copy.hashMismatch, { latest: latestTag });
                        addButton(copy.download, exeAsset && exeAsset.browser_download_url || DOWNLOAD_LATEST_URL);
                    } else {
                        render(copy.upToDate, { latest: latestTag });
                        var fileStatus = document.createElement('span');
                        fileStatus.id = 'file-status';
                        fileStatus.style = 'display:block;margin-top:12px';
                        fileStatus.textContent = submittedHash && officialDigest ? copy.fileMatches : copy.fileUnchecked;
                        bodyEl.appendChild(fileStatus);
                    }
                }
                document.title = 'DiscReveal — ' + titleEl.textContent;
            })
            .catch(function () {
                clearTimeout(timeout);
                actionEl.replaceChildren();
                render(copy.checkFailed);
                addButton(copy.releases, RELEASES_LATEST_URL);
                document.title = 'DiscReveal — ' + copy.checkFailed[0];
            });
    })();
    </script>
</body>
</html>
